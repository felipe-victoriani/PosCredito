<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PósCréditos · A conversa começa quando o filme acaba.</title>
  <meta name="description" content="Avalie e comente filmes, séries, animes e doramas, descubra onde assistir no Brasil e siga quem tem gosto parecido com o seu.">
  <meta name="theme-color" content="#0E0E12">
  <meta name="color-scheme" content="dark">

  <!-- Ícones -->
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Open Graph (trocar o domínio pelo de produção quando definir) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PósCréditos">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="PósCréditos · A conversa começa quando o filme acaba.">
  <meta property="og:description" content="A comunidade brasileira de reviews de filmes, séries, animes e doramas.">
  <meta property="og:url" content="https://poscredito.vercel.app/">
  <meta property="og:image" content="https://poscredito.vercel.app/img/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo do PósCréditos com o slogan A conversa começa quando o filme acaba.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PósCréditos · A conversa começa quando o filme acaba.">
  <meta name="twitter:description" content="A comunidade brasileira de reviews de filmes, séries, animes e doramas.">
  <meta name="twitter:image" content="https://poscredito.vercel.app/img/og-image.png">

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://image.tmdb.org">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Mono:wght@400;500&display=swap">

  <!-- Estilos -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">

  <script type="module" src="js/feed.js"></script>
</head>
<body>
  <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

  <!-- Topo com o logo -->
  <header class="topo topo--com-acoes">
    <a class="marca" href="index.html" aria-label="PósCréditos, página inicial">
      <!-- Símbolo: reticências subindo dentro do círculo amarelo -->
      <svg class="marca__simbolo" viewBox="0 0 96 96" width="40" height="40" aria-hidden="true" focusable="false">
        <circle cx="48" cy="48" r="48" fill="#F5B700"/>
        <g fill="#0E0E12">
          <circle cx="28" cy="62" r="7.5"/>
          <circle cx="48" cy="48" r="7.5"/>
          <circle cx="68" cy="34" r="7.5"/>
        </g>
      </svg>
      <span class="marca__texto" aria-hidden="true">Pós<span class="marca__ponto">·</span>Créditos</span>
    </a>
    <!-- Sino de notificações: aparece só para quem está logado (sino.js) -->
    <a id="sino" class="sino" href="notificacoes.html" aria-label="Notificações" hidden></a>
    <!-- Slogan logo abaixo da marca (referência C) -->
    <p class="topo__slogan">A conversa começa quando o filme acaba.</p>
  </header>

  <main id="conteudo" class="container">
    <h1 class="visualmente-oculto">PósCréditos: feed de reviews</h1>

    <!-- Abas do feed (setas do teclado trocam de aba) -->
    <div id="abas-feed" class="abas abas--feed" role="tablist" aria-label="Feed">
      <button id="aba-seguindo" class="abas__aba" type="button" role="tab" aria-selected="false" aria-controls="painel-feed" data-aba="seguindo" tabindex="-1">Seguindo</button>
      <button id="aba-em-alta" class="abas__aba" type="button" role="tab" aria-selected="true" aria-controls="painel-feed" data-aba="em-alta">Em alta</button>
      <button id="aba-pessoas" class="abas__aba" type="button" role="tab" aria-selected="false" aria-controls="painel-feed" data-aba="pessoas" tabindex="-1">Pessoas</button>
    </div>

    <div id="painel-feed" class="painel" role="tabpanel" aria-labelledby="aba-em-alta">
      <!-- Filtros de tipo: valem para o feed e para a vitrine abaixo -->
      <div id="filtros-feed" class="chips" role="group" aria-label="Filtrar por tipo">
        <button type="button" class="chip" data-filtro="tudo" aria-pressed="true">Tudo</button>
        <button type="button" class="chip" data-filtro="filme" aria-pressed="false">Filmes</button>
        <button type="button" class="chip" data-filtro="serie" aria-pressed="false">Séries</button>
        <button type="button" class="chip" data-filtro="anime" aria-pressed="false">Animes</button>
        <button type="button" class="chip" data-filtro="dorama" aria-pressed="false">Doramas</button>
      </div>

      <ul id="lista-feed" class="lista-reviews" aria-label="Reviews"></ul>
      <button id="mais-feed" class="botao botao--secundario botao--bloco" type="button" hidden>Ver mais</button>

      <!-- Aba "Pessoas": sugestões para seguir (no lugar das reviews) -->
      <ul id="lista-pessoas" class="lista-sugestoes" aria-label="Sugestões para seguir" hidden></ul>
      <button id="mais-pessoas" class="botao botao--secundario botao--bloco" type="button" hidden>Ver mais pessoas</button>
    </div>

    <!-- Vitrine do catálogo (TMDB): descoberta mesmo sem reviews -->
    <section class="secao" aria-labelledby="titulo-vitrine">
      <h2 id="titulo-vitrine" class="secao__titulo">Em alta no catálogo</h2>
      <ul id="grade-em-alta" class="grade-posters" aria-label="Títulos em alta"></ul>
      <button id="carregar-mais" class="botao botao--secundario botao--bloco" type="button" hidden>Carregar mais</button>
    </section>
  </main>

  <footer class="rodape"></footer>
  <nav class="nav-inferior" aria-label="Navegação principal" data-ativo="inicio"></nav>
</body>
</html>
